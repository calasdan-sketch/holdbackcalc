name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e . pytest build twine ruff mypy
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest -q
      - name: Build
        run: python -m build
      - name: Twine check
        run: twine check dist/*
      - name: Smoke-test the built wheel in a clean virtualenv (not the checkout)
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          if [ -d "$RUNNER_TEMP/clean/Scripts" ]; then BIN="$RUNNER_TEMP/clean/Scripts"; else BIN="$RUNNER_TEMP/clean/bin"; fi
          "$BIN/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$BIN/holdbackcalc" --version
          "$BIN/holdbackcalc" ab-invoice 2026-06-30
          "$BIN/python" -m holdbackcalc --json on-lien 2026-01-01
