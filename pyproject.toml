[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holdbackcalc"
version = "0.1.0"
description = "Prompt-payment and holdback deadline assistant for Alberta and Ontario construction work (verified rules only)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "calasdan-sketch" }]
keywords = ["prompt-payment", "holdback", "construction", "lien", "alberta", "ontario", "deadlines"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Office/Business",
]

[project.scripts]
holdbackcalc = "holdbackcalc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
